openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: project-requests
    description: Project request operations
  - name: auth
    description: Authentication operations
  - name: ai
    description: AI tool operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /project-requests:
    post:
      operationId: createProjectRequest
      tags: [project-requests]
      summary: Submit a project request
      description: Submits a new project request from a potential client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRequestResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Refresh session token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/generate:
    post:
      operationId: aiGenerate
      tags: [ai]
      summary: Stream AI-generated content via SSE
      description: Streams AI-generated content for a specific tool. Credits are checked before generation and deducted after successful completion.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiGenerateRequest"
      responses:
        "200":
          description: SSE stream of generated content
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Insufficient credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/generate-pdf:
    post:
      operationId: aiGeneratePdf
      tags: [ai]
      summary: Generate formatted HTML document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePdfRequest"
      responses:
        "200":
          description: Generated HTML document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratePdfResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/tool-results/list:
    post:
      operationId: listToolResults
      tags: [ai]
      summary: List tool results for authenticated user
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListToolResultsRequest"
      responses:
        "200":
          description: List of tool results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolResult"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/tool-results/get:
    post:
      operationId: getToolResult
      tags: [ai]
      summary: Get a single tool result
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
              required:
                - id
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResult"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CreateProjectRequest:
      type: object
      properties:
        fullName:
          type: string
        companyName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        palCategory:
          type: string
          enum: [reel, spotlight, system, evergreen]
        missionId:
          type: string
        packageDetails:
          type: string
          description: JSON string of selected package configuration
        estimatedTotal:
          type: number
        projectDescription:
          type: string
        preferredTimeline:
          type: string
      required:
        - fullName
        - email
        - palCategory
        - missionId
    ProjectRequestResponse:
      type: object
      properties:
        id:
          type: integer
        message:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - message
        - createdAt
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        fullName:
          type: string
        companyName:
          type: string
      required:
        - email
        - password
        - fullName
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password
    AuthResponse:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        fullName:
          type: string
        companyName:
          type: string
          nullable: true
        role:
          type: string
          enum: [guest, registered, member, admin]
        credits:
          type: integer
        createdAt:
          type: string
          format: date-time
        token:
          type: string
      required:
        - id
        - email
        - fullName
        - role
        - credits
        - createdAt
        - token
    AiGenerateRequest:
      type: object
      properties:
        toolId:
          type: string
        palId:
          type: string
        inputs:
          type: object
          additionalProperties:
            type: string
      required:
        - toolId
        - inputs
    GeneratePdfRequest:
      type: object
      properties:
        title:
          type: string
        sections:
          type: array
          items:
            type: object
            properties:
              heading:
                type: string
              content:
                type: string
              type:
                type: string
            required:
              - content
        toolId:
          type: string
      required:
        - title
        - sections
    GeneratePdfResponse:
      type: object
      properties:
        html:
          type: string
        title:
          type: string
        generatedAt:
          type: string
          format: date-time
      required:
        - html
        - title
        - generatedAt
    ListToolResultsRequest:
      type: object
      properties:
        toolId:
          type: string
        limit:
          type: integer
          maximum: 50
    ToolResult:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
          nullable: true
        toolId:
          type: string
        palId:
          type: string
          nullable: true
        inputs:
          type: object
          additionalProperties:
            type: string
        output:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - toolId
        - output
        - createdAt
